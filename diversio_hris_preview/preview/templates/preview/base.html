<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Diversio HRIS import preview{% endblock %}</title>
<style>
  body { font-family: system-ui, sans-serif; line-height: 1.5; margin: 0 auto;
         max-width: 60rem; padding: 2rem 1rem; color: #1a1a1a; }
  h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
  h2 { font-size: 1.1rem; margin-top: 2rem; border-bottom: 1px solid #ddd;
       padding-bottom: 0.25rem; }
  .muted { color: #666; }
  table { border-collapse: collapse; width: 100%; margin-top: 0.5rem; }
  th, td { text-align: left; padding: 0.35rem 0.6rem; border-bottom: 1px solid #eee;
           vertical-align: top; }
  th { background: #f5f5f5; font-weight: 600; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .cards { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1rem; }
  .card { border: 1px solid #ddd; border-radius: 4px; padding: 0.6rem 0.9rem;
          min-width: 8rem; }
  .card b { display: block; font-size: 1.5rem; font-variant-numeric: tabular-nums; }
  .error { background: #fdf2f2; border: 1px solid #e5b3b3; border-radius: 4px;
           padding: 0.75rem 1rem; margin: 1rem 0; }
  .empty { color: #666; font-style: italic; }
  .upload-row { display: flex; align-items: end; gap: 0.75rem; flex-wrap: wrap;
                margin-top: 1rem; }
  .upload-field label { display: block; font-weight: 600; margin-bottom: 0.35rem; }
  .upload-field input { max-width: 100%; }
  .upload-submit { align-self: end; }
  .is-hidden { display: none; }
  .pager { display: flex; align-items: center; gap: 0.75rem; margin: 0.75rem 0 1.5rem; }
  .pager a { border: 1px solid #ccc; border-radius: 4px; padding: 0.25rem 0.55rem;
             text-decoration: none; color: #1a1a1a; }
  .pager span { color: #666; }
  button { cursor: pointer; padding: 0.4rem 0.75rem; }
  code { background: #f2f2f2; padding: 0.1rem 0.3rem; border-radius: 3px; }
</style>
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
